<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeeoM</title>
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #0B0F19; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; padding: 40px 20px; }
    .lock-icon { width: 48px; height: 48px; fill: #38BDF8; margin-top: 40px; }
    .brand-title { font-size: 28px; font-weight: bold; letter-spacing: 2px; margin-top: 10px; }
    .sub-title { color: #64748B; font-size: 14px; margin-top: 4px; }
    .dots { display: flex; gap: 14px; margin-top: 30px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #475569; }
    .dot.filled { background-color: #38BDF8; border-color: #38BDF8; }
    .error-msg { color: #EF4444; font-size: 13px; height: 18px; margin-top: 10px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; max-width: 300px; margin-bottom: 20px; }
    .key { background: #131D2E; border-radius: 50%; height: 70px; width: 70px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto; cursor: pointer; }
    .key:active { background: #1E293B; }
    #chat-screen { display: none; flex-direction: column; height: 100vh; }
    .header { background: #131D2E; padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1E293B; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #0284C7; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .user-info .name { font-weight: 600; font-size: 16px; }
    .user-info .status { font-size: 12px; color: #22C55E; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; background: #22C55E; border-radius: 50%; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .msg.incoming { background: #1E293B; align-self: flex-start; }
    .msg.outgoing { background: #0284C7; align-self: flex-end; }
    .input-bar { background: #131D2E; padding: 10px 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid #1E293B; }
    .input-bar input { flex: 1; background: #0B0F19; border: 1px solid #1E293B; border-radius: 20px; padding: 10px 16px; color: #fff; outline: none; font-size: 14px; }
    .send-btn { background: #38BDF8; color: #000; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="pin-screen">
    <div style="display: flex; flex-direction: column; align-items: center;">
      <svg class="lock-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      <div class="brand-title">NeeoM</div>
      <div class="sub-title">Private Space</div>
      <div class="dots">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
        <div class="dot" id="dot2"></div>
        <div class="dot" id="dot3"></div>
        <div class="dot" id="dot4"></div>
        <div class="dot" id="dot5"></div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>
    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div></div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div class="key" onclick="delKey()">⌫</div>
    </div>
  </div>

  <div id="chat-screen">
    <div class="header">
      <div class="avatar">❤️</div>
      <div class="user-info">
        <div class="name">NeeoM Partner</div>
        <div class="status"><span class="status-dot"></span> Online</div>
      </div>
    </div>
    <div class="chat-body" id="chatBox">
      <div class="msg incoming">NeeoM Private Space active hai ❤️</div>
    </div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <script>
    let enteredPin = "";
    const correctPin = "717171";
    function updateDots() {
      for (let i = 0; i < 6; i++) {
        const dot = document.getElementById('dot' + i);
        if (i < enteredPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
    }
    function pressKey(num) {
      if (enteredPin.length < 6) {
        enteredPin += num;
        document.getElementById('errorMsg').innerText = "";
        updateDots();
        if (enteredPin.length === 6) {
          if (enteredPin === correctPin) {
            document.getElementById('pin-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
          } else {
            document.getElementById('errorMsg').innerText = "Galat PIN!";
            enteredPin = "";
            updateDots();
          }
        }
      }
    }
    function delKey() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      }
    }
    function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg outgoing';
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";
    }
  </script>
</body>
</html>
